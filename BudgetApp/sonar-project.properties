sonar.projectKey=aienmii_budgetApp
sonar.organization=aienmii
sonar.projectName=budgetApp
sonar.host.url=https://sonarcloud.io


sonar.modules=backend,frontend

backend.sonar.projectBaseDir=backend
backend.sonar.sources=src/main
backend.sonar.java.binaries=target/classes
backend.sonar.java.libraries=/home/runner/.m2/repository/**/*.jar

# frontend bez testów
frontend.sonar.projectBaseDir=frontend
frontend.sonar.sources=src
frontend.sonar.exclusions=**/*.spec.ts,**/*.test.tsx,**/__tests__/**
sonar.coverage.exclusions=frontend/src/**/*.tsx,frontend/src/**/*.ts